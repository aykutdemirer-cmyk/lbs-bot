name: Daily video

on:
  schedule:
    - cron: "0 9 * * *"     # her gün 09:00 UTC = 12:00 Türkiye saati
  workflow_dispatch:         # GitHub'da "Run workflow" ile elle de çalışır
    inputs:
      count:
        description: "Kaç video üretilsin?"
        default: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2
          pip install -r requirements.txt
      - name: Render and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in $(seq 1 "${{ github.event.inputs.count || 1 }}"); do
            python lbs.py --send
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/
          retention-days: 7
